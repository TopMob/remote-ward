[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TopMob"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/TopMob/remote-ward"

[workspace.dependencies]
# Асинхронность и многопоточность
tokio = { version = "1.43", features = ["full"] }
rayon = "1.10"

# Логирование и диагностика
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Ошибки
thiserror = "2.0"
anyhow = "1.0"

# Сериализация и бинарные структуры
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
bytemuck = { version = "1.21", features = ["derive"] }

# Сеть и криптография
socket2 = "0.5"

# FEC — кодирование с исправлением ошибок (Reed-Solomon для UDP видео)
reed-solomon-erasure = { version = "6.0", features = ["simd-accel"] }

# Windows API
windows = "0.58"

# Платформонезависимые утилиты
parking_lot = "0.12"
crossbeam-channel = "0.5"
smallvec = { version = "1.13", features = ["const_generics"] }
once_cell = "1.20"

# Оптимизации сборки для минимальной задержки в Release
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "none"

# Быстрая сборка для разработки
[profile.dev]
opt-level = 1
debug = true
