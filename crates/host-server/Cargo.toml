[package]
name = "host-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Host streaming server combining zero-copy screen capture, NVENC, WASAPI audio, and transport"

[dependencies]
core-protocol = { path = "../core-protocol" }
core-transport = { path = "../core-transport" }
host-capture = { path = "../host-capture" }
host-encode = { path = "../host-encode" }
host-input = { path = "../host-input" }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
socket2 = { workspace = true }
getrandom = "0.2"

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_System_Com",
]
